name: Build Windows (htmlfix)

on:
  push:
    branches:
      - 'release-v*'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: ${{ runner.os }}-electron-vite-cache-v1-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts --loglevel error

      - name: Rebuild native modules
        # Electron 42+ cppgc headers use __builtin_frame_address (Clang-only).
        # windows-2022 has LLVM pre-installed; point node-gyp to clang-cl.exe.
        run: |
          (Get-Content .npmrc) | Where-Object { $_ -notmatch '^clang=' } | Set-Content .npmrc
          $llvm = "C:\Program Files\LLVM\bin"
          $env:CC  = "$llvm\clang-cl.exe"
          $env:CXX = "$llvm\clang-cl.exe"
          $env:AR  = "$llvm\llvm-lib.exe"
          $env:LD  = "$llvm\lld-link.exe"
          $env:Path = "$llvm;$env:Path"
          npx @electron/rebuild -f

      - name: Build Windows
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marktext2-windows-htmlfix
          path: dist/*.exe
          retention-days: 30
