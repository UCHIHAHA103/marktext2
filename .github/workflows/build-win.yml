name: Build Windows (htmlfix)

on:
  push:
    branches:
      - 'release-v*'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: ${{ runner.os }}-electron-vite-cache-v1-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts --loglevel error

      - name: Patch ced compact_enc_det binding.gyp for ClangCL
        # ced's vendor/compact_enc_det/binding.gyp has -Wno-narrowing only in
        # cflags_cc (Linux) and xcode_settings (macOS). On Windows with ClangCL,
        # neither applies, causing -Wc++11-narrowing errors. Add msvs_settings.
        shell: pwsh
        run: |
          python -c "
          import re, sys
          p = 'node_modules/ced/vendor/compact_enc_det/binding.gyp'
          c = open(p, 'r', encoding='utf-8').read()
          if 'msvs_settings' in c:
              print('already patched')
              sys.exit(0)
          inj = '\"msvs_settings\": { \"VCCLCompilerTool\": { \"AdditionalOptions\": [\"-Wno-c++11-narrowing\", \"-w\"] } },\n      '
          c2 = c.replace('\"xcode_settings\":', inj + '\"xcode_settings\":', 1)
          if c == c2:
              print('FAILED: xcode_settings anchor not found'); sys.exit(1)
          open(p, 'w', encoding='utf-8').write(c2)
          print('patched:'); print(c2)
          "

      - name: Rebuild native modules
        # Electron 42+ cppgc headers use __builtin_frame_address (Clang-only).
        # GYP_DEFINES=clang_cl=1 makes MSBuild use the ClangCL toolset.
        shell: pwsh
        run: |
          (Get-Content .npmrc) | Where-Object { $_ -notmatch '^clang=' } | Set-Content .npmrc
          $env:GYP_DEFINES = "msvs_version=2022 clang_cl=1"
          npx @electron/rebuild -f

      - name: Build Windows
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marktext2-windows-htmlfix
          path: dist/*.exe
          retention-days: 30
