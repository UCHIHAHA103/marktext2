name: Build Windows (htmlfix)

on:
  push:
    branches:
      - 'release-v*'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: ${{ runner.os }}-electron-vite-cache-v1-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts --loglevel error

      - name: Patch ced compact_enc_det binding.gyp for ClangCL
        # ced's vendor/compact_enc_det/binding.gyp has -Wno-narrowing only in
        # cflags_cc (Linux) and xcode_settings (macOS). On Windows with ClangCL,
        # neither applies, causing -Wc++11-narrowing errors. Add msvs_settings.
        shell: pwsh
        run: |
          $gyp = "node_modules/ced/vendor/compact_enc_det/binding.gyp"
          if (-not (Test-Path $gyp)) { throw "binding.gyp not found at $gyp" }
          $content = Get-Content $gyp -Raw
          if ($content -notmatch 'msvs_settings') {
            # Inject msvs_settings before xcode_settings
            $patched = $content -replace '(?ms)("xcode_settings":)', @'
"msvs_settings": {
        "VCCLCompilerTool": {
          "AdditionalOptions": [ "-Wno-c++11-narrowing", "-w" ]
        }
      },
      $1
'@
            Set-Content -Path $gyp -Value $patched -NoNewline
            Write-Host "Patched $gyp:"
            Get-Content $gyp
          } else {
            Write-Host "msvs_settings already present"
          }

      - name: Rebuild native modules
        # Electron 42+ cppgc headers use __builtin_frame_address (Clang-only).
        # GYP_DEFINES=clang_cl=1 makes MSBuild use the ClangCL toolset.
        shell: pwsh
        run: |
          (Get-Content .npmrc) | Where-Object { $_ -notmatch '^clang=' } | Set-Content .npmrc
          $env:GYP_DEFINES = "msvs_version=2022 clang_cl=1"
          npx @electron/rebuild -f

      - name: Build Windows
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marktext2-windows-htmlfix
          path: dist/*.exe
          retention-days: 30
